name: Android CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: WeatherApp

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests and generate coverage
        run: ./gradlew testDebugUnitTest jacocoTestReport

      - name: Check JaCoCo report
        run: |
          echo "Looking for JaCoCo reports..."
          find app/build -name "jacocoTestReport.xml" -print

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: WeatherApp
          args: >
            -Dsonar.organization=chrisadeyemi
            -Dsonar.projectKey=ChrisAdeyemi_WeatherApp
            -Dsonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeatherApp-debug-apk
          path: WeatherApp/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WeatherApp/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
